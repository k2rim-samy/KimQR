name: qr_master
description: A premium Flutter QR code generator and scanner for Android and iOS.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  printing: ^5.13.2
  pdf: ^3.11.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  flex_color_picker: ^3.5.1
  url_launcher: ^6.3.0

flutter:
  uses-material-design: true
  generate: false
